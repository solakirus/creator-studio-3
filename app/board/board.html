<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Board · Creator Studio 3</title>
<script>
/* Creator Studio 3: this page runs inside the app (an iframe on the Board
   screen). The theme and colours follow Creator Studio's, read from the
   page around it; on its own it falls back to Storyboard's look. */
(function(){
  var r = document.documentElement;
  try {
    var P = window.parent !== window ? window.parent : null;
    if (P && P.document) {
      var cs = P.getComputedStyle(P.document.documentElement);
      var v = function(n){ return cs.getPropertyValue(n).trim(); };
      if (v('--bg')) {
        r.dataset.cs3 = '1';
        var map = { '--table':'--bg', '--chrome':'--surface-1', '--card':'--surface-2', '--ink':'--cream',
          '--muted':'--muted', '--line':'--line', '--field':'--surface-2', '--field-hover':'--line',
          '--slate':'--orange', '--slate-bar':'--surface-1', '--frame':'--surface-1', '--wire':'--muted',
          '--danger':'--red' };
        for (var k in map) if (v(map[k])) r.style.setProperty(k, v(map[k]));
        r.style.setProperty('--on-slate', v('--bg'));
        r.style.setProperty('--dot', 'color-mix(in srgb, ' + v('--cream') + ' 10%, transparent)');
        var mode = P.document.documentElement.dataset.mode;
        r.dataset.theme = mode === 'light' ? 'light' : 'dark';
      }
    }
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@500;700&family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;600;700&family=Permanent+Marker&family=Playfair+Display:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --table:#DCE2E7; --dot:rgba(28,34,48,.16); --chrome:#F5F7F9; --card:#FFFFFF; --ink:#1C2230; --muted:#5B6474;
  --line:#C5CDD5; --edge:rgba(28,34,48,.06); --shadow:rgba(28,34,48,.35); --field:#EEF1F4; --field-hover:#F4F6F8;
  --slate:#2F4A6D; --slate-bar:#253A57; --on-slate:#F2F4F7; --frame:#E8ECF0; --wire:#6B7686; --danger:#B3261E;
  --c-tape:#F2C14E; --c-sky:#6FA8DC; --c-mint:#5FB88F; --c-rose:#E07A8B; --c-slate:#7E8CA8; --c-orange:#E8792B; --c-teal:#3FA7A0; --c-blue:#4F7FF0;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"DM Sans","Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:14px; color:var(--ink); background:var(--table);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --table:#181C22; --dot:rgba(255,255,255,.08); --chrome:#20252C; --card:#262C34; --ink:#E7EAEE; --muted:#9AA3AF;
  --line:#3A424D; --edge:rgba(0,0,0,.3); --shadow:rgba(0,0,0,.7); --field:#2F3640; --field-hover:#2B3139;
  --slate:#8FB0D9; --slate-bar:#1E2F46; --on-slate:#E7EEF7; --frame:#1F242B; --wire:#8792A1; --danger:#E5645B;
}}
:root[data-theme="dark"]{
  --table:#181C22; --dot:rgba(255,255,255,.08); --chrome:#20252C; --card:#262C34; --ink:#E7EAEE; --muted:#9AA3AF;
  --line:#3A424D; --edge:rgba(0,0,0,.3); --shadow:rgba(0,0,0,.7); --field:#2F3640; --field-hover:#2B3139;
  --slate:#8FB0D9; --slate-bar:#1E2F46; --on-slate:#E7EEF7; --frame:#1F242B; --wire:#8792A1; --danger:#E5645B;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--table);overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--slate);outline-offset:2px}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;height:52px;padding:0 12px;background:var(--chrome);border-bottom:1px solid var(--line);flex-shrink:0;position:relative;z-index:20}
#crumbs{display:flex;align-items:center;gap:4px;overflow-x:auto;white-space:nowrap;min-width:0;scrollbar-width:none}
.crumb{background:none;border:0;padding:6px 8px;border-radius:6px;color:var(--muted)}
.crumb:hover{background:var(--field)}
.sep{color:var(--line)}
.crumb-name{font:inherit;font-size:17px;font-weight:600;color:var(--ink);background:transparent;border:0;border-radius:6px;padding:6px 8px;min-width:6ch}
.crumb-name:hover{background:var(--field-hover)}
.crumb-name:focus{outline:none;background:var(--field)}
.zoom{display:flex;align-items:center;gap:2px;flex-shrink:0}
.zoom button{background:none;border:0;min-width:32px;height:32px;border-radius:6px;padding:0 8px;font-variant-numeric:tabular-nums}
.zoom button:hover{background:var(--field)}

/* Stage */
.app-main{flex:1;position:relative;min-height:0}
#stage{position:absolute;inset:0;overflow:hidden;background-color:var(--table);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.5px);touch-action:none}
#stage.panning{cursor:grabbing}
#stage.connecting{cursor:crosshair}
#stage.drop{box-shadow:inset 0 0 0 3px var(--slate)}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#wires{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;color:var(--wire);z-index:2}
#ink{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;z-index:100000}
#ink path{fill:none;stroke-linecap:round;stroke-linejoin:round}
#stage.drawing{cursor:crosshair}
.wire .line{fill:none;stroke:currentColor;stroke-width:2}
.wire .hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
.wire.sel .line{stroke:var(--slate);stroke-width:3}
.wire.temp .line{stroke-dasharray:6 5}
.wire-del{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;border:0;background:var(--danger);color:#fff;font-size:16px;line-height:1;z-index:99999}
#empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:34ch;text-align:center;color:var(--muted);line-height:1.5;pointer-events:none}

/* Toolbar */
.tools{position:absolute;left:12px;top:50%;transform:translateY(-50%);max-height:calc(100% - 24px);overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding:6px;background:var(--chrome);border:1px solid var(--line);border-radius:12px;z-index:10;box-shadow:0 8px 24px -14px var(--shadow)}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;width:60px;padding:8px 2px 6px;background:none;border:0;border-radius:8px;font-size:11.5px;color:var(--muted)}
.tool svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{background:var(--field);color:var(--ink)}
.tool[data-type="shot"] svg{stroke:var(--slate)}

/* Cards */
.card{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 0 var(--edge),0 8px 18px -12px var(--shadow);touch-action:none;user-select:none;-webkit-user-select:none}
.card[data-color]{background:color-mix(in srgb,var(--accent) 16%,var(--card));border-top:3px solid var(--accent)}
.card[data-color="tape"]{--accent:var(--c-tape)} .card[data-color="sky"]{--accent:var(--c-sky)} .card[data-color="mint"]{--accent:var(--c-mint)} .card[data-color="rose"]{--accent:var(--c-rose)} .card[data-color="slate"]{--accent:var(--c-slate)} .card[data-color="orange"]{--accent:var(--c-orange)} .card[data-color="teal"]{--accent:var(--c-teal)} .card[data-color="blue"]{--accent:var(--c-blue)}
.card.sel{outline:2px solid var(--slate);outline-offset:2px}
.card.target{outline:2px dashed var(--slate);outline-offset:4px}
.card.dragging{box-shadow:0 1px 0 var(--edge),0 22px 40px -18px var(--shadow);cursor:grabbing}
.card-bar{display:flex;align-items:center;gap:6px;min-height:30px;padding:4px 4px 0 10px;cursor:grab}
.card-kind{flex:1;font-size:12px;color:var(--muted)}
.bar-extra{display:flex;align-items:center;gap:4px}
.menu-btn{width:26px;height:26px;border:0;background:none;border-radius:6px;color:var(--muted);display:grid;place-items:center;padding:0}
.menu-btn:hover{background:var(--field)}
.menu-btn svg{width:16px;height:16px;fill:currentColor}
.card-body{display:flex;flex-direction:column;gap:4px;padding:2px 10px 10px}
.f{font:inherit;color:inherit;background:transparent;border:0;border-radius:4px;padding:4px 6px;margin:0 -6px;width:calc(100% + 12px);resize:none;overflow:hidden;line-height:1.45;user-select:text;-webkit-user-select:text;display:block}
.f:hover{background:var(--field-hover)}
.f:focus{outline:none;background:var(--field)}
.f::placeholder{color:var(--muted);opacity:.75}
.title{font-size:15px;font-weight:600}
select.f{appearance:none;-webkit-appearance:none;cursor:pointer;font-size:13px;color:var(--muted);width:auto;margin:0;padding:3px 8px;border:1px solid var(--line);border-radius:999px}
.hint{margin:0;font-size:12px;color:var(--muted)}
.txt-btn{align-self:flex-start;background:none;border:0;padding:4px 0;color:var(--slate);font-weight:500;font-size:13px}
.txt-btn:hover{text-decoration:underline}
.open-link{font-size:13px;color:var(--slate);font-weight:500;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.open-link:hover{text-decoration:underline}

/* Shot card: the storyboard panel */
.t-shot{border-color:var(--slate-bar)}
.t-shot::before{content:"";display:block;height:9px;border-radius:5px 5px 0 0;background:repeating-linear-gradient(-55deg,var(--slate-bar) 0 12px,var(--on-slate) 12px 24px)}
.t-shot .card-bar{background:var(--slate-bar);color:var(--on-slate);padding:4px 4px 4px 10px;font-family:"Courier Prime","Courier New",monospace}
.t-shot .menu-btn{color:var(--on-slate)}
.t-shot .menu-btn:hover{background:rgba(255,255,255,.12)}
.shot-no{flex:1;display:flex;align-items:center;gap:2px;font-weight:700;font-size:14px}
.t-shot .card-bar .f{margin:0;width:auto;font-family:inherit;padding:2px 4px}
.t-shot .card-bar .f:hover,.t-shot .card-bar .f:focus{background:rgba(255,255,255,.12)}
.num{width:4ch;font-weight:700}
.dur{width:6ch;text-align:right;font-size:13px}
.t-shot .card-bar .f::placeholder{color:var(--on-slate);opacity:.55}
.t-shot .card-body{padding-top:8px}
.frame{aspect-ratio:16/9;background:var(--frame);border:1px dashed var(--line);border-radius:4px;display:grid;place-items:center;overflow:hidden;cursor:pointer;margin-bottom:4px}
.frame.has{border-style:solid}
.frame img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.frame-empty{font-size:13px;color:var(--muted)}
.t-image .frame{aspect-ratio:auto;min-height:140px}
.t-image .frame.has img{height:auto;object-fit:contain}
.row{display:flex;gap:6px;align-items:center}
.vo{font-family:"Courier Prime","Courier New",monospace;font-size:13px}

/* To-do */
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.todo li{display:flex;align-items:center;gap:6px}
.todo input[type=checkbox]{width:16px;height:16px;accent-color:var(--slate);flex-shrink:0;margin:0}
.todo .f{margin:0;width:100%}
.todo li.done .f{text-decoration:line-through;color:var(--muted)}

/* Music */
.player audio{width:100%;height:36px;margin:2px 0}

/* Board card */
.preview{position:relative;aspect-ratio:16/10;background:var(--table);border-radius:4px;overflow:hidden;margin-bottom:4px}
.pv{position:absolute;background:var(--line);border-radius:2px}
.pv-frame{background:transparent;border:1px solid var(--muted)} .pv-heading{background:var(--ink)} .pv-shot{background:var(--slate)} .pv-music{background:var(--c-mint)} .pv-link{background:var(--c-sky)} .pv-image{background:var(--muted)}
.open-board{align-self:flex-start;border:0;background:var(--slate);color:var(--card);border-radius:6px;padding:6px 12px;font-weight:600;font-size:13px;margin-top:4px}

/* Handles */
.port{position:absolute;right:-9px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--card);border:2px solid var(--slate);padding:0;opacity:0;cursor:crosshair;z-index:2}
.port::after{content:"";position:absolute;inset:-10px}
.card:hover .port,.card.sel .port{opacity:1}
.rz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;opacity:0;background:linear-gradient(135deg,transparent 55%,var(--muted) 55% 62%,transparent 62% 74%,var(--muted) 74% 81%,transparent 81%)}
.card:hover .rz,.card.sel .rz{opacity:.8}
@media (hover:none){ .card:hover .port,.card:hover .rz{opacity:0} .card.sel .port{opacity:1} .card.sel .rz{opacity:.8} }

/* Menu */
.menu{position:absolute;top:32px;right:4px;min-width:160px;padding:6px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 28px -12px var(--shadow);display:flex;flex-direction:column;z-index:5;font-family:"DM Sans","Instrument Sans",system-ui,sans-serif}
.menu > button{background:none;border:0;text-align:left;padding:7px 8px;border-radius:5px}
.menu > button:hover{background:var(--field)}
.menu .danger{color:var(--danger)}
.swatches{display:flex;gap:6px;padding:4px 4px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.sw{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);padding:0;background:var(--card)}
.sw[data-c="tape"]{background:var(--c-tape)} .sw[data-c="sky"]{background:var(--c-sky)} .sw[data-c="mint"]{background:var(--c-mint)} .sw[data-c="rose"]{background:var(--c-rose)} .sw[data-c="slate"]{background:var(--c-slate)} .sw[data-c="orange"]{background:var(--c-orange)} .sw[data-c="teal"]{background:var(--c-teal)} .sw[data-c="blue"]{background:var(--c-blue)}
.sw[data-c=""]{background:linear-gradient(135deg,var(--card) 45%,var(--danger) 45% 55%,var(--card) 55%)}

/* View toggle + more menu */
.top-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.seg-toggle{display:flex;background:var(--field);border-radius:8px;padding:2px}
.seg-toggle button{border:0;background:none;border-radius:6px;padding:5px 12px;font-weight:500;color:var(--muted)}
.seg-toggle button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px var(--edge)}
.more-wrap{position:relative}
#moreBtn{width:32px;height:32px;border:0;background:none;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
#moreBtn:hover{background:var(--field)}
#moreBtn svg{width:16px;height:16px;fill:currentColor}
.top-menu{top:38px;right:0;min-width:220px;max-height:calc(100vh - 120px);overflow-y:auto;overscroll-behavior:contain}
.menu .menu-note{margin:6px 8px 2px;font-size:12px;color:var(--muted);line-height:1.4}
body:not([data-mode="canvas"]) .tools,body:not([data-mode="canvas"]) .zoom{display:none}

/* Timeline */
#timeline{position:absolute;inset:0;overflow:auto;background:var(--table);padding:28px 24px 48px}
.tl-wrap{max-width:1000px;margin:0 auto}
.tl-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.tl-title{font-size:24px;font-weight:600;margin:0;letter-spacing:-.01em}
.tl-stats{margin:4px 0 0;color:var(--muted)}
.tl-actions{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:8px 14px;font-weight:500}
.btn:hover{background:var(--field)}
.btn.primary{background:var(--slate);border-color:var(--slate);color:var(--card)}
.btn.primary:hover{filter:brightness(1.08)}
.strip{display:flex;gap:3px;height:52px;margin:22px 0 6px;padding:5px;background:var(--slate-bar);border-radius:6px}
.seg{flex:1 1 0;min-width:26px;border:0;border-radius:3px;background:#7FB2E2;color:#0F2037;font-family:"Courier Prime","Courier New",monospace;font-weight:700;font-size:13px;display:flex;align-items:flex-end;padding:4px 6px;overflow:hidden}
.seg:nth-child(even){background:#A9CCEC}
.seg.nodur{background:repeating-linear-gradient(45deg,#8C97A6 0 6px,#737F8F 6px 12px);color:#fff}
.seg:hover{filter:brightness(1.1)}
.ruler{display:flex;justify-content:space-between;font-family:"Courier Prime","Courier New",monospace;font-size:12px;color:var(--muted);margin-bottom:22px}
.tl-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tl-row{display:grid;grid-template-columns:30px 168px 120px 1fr 84px;grid-template-areas:"move thumb meta text dur";gap:14px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px}
.tl-row.flash{outline:2px solid var(--slate);outline-offset:2px}
.tl-move{grid-area:move;display:flex;flex-direction:column;gap:4px}
.tl-move button{width:28px;height:28px;border:1px solid var(--line);background:none;border-radius:5px;padding:0}
.tl-move button:disabled{opacity:.3;cursor:default}
.tl-thumb{grid-area:thumb;aspect-ratio:16/9;background:var(--frame);border-radius:4px;overflow:hidden;display:grid;place-items:center;font-size:12px;color:var(--muted)}
.tl-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.tl-meta{grid-area:meta}
.tl-meta p{margin:0}
.tl-no{font-family:"Courier Prime","Courier New",monospace;font-weight:700;font-size:15px}
.tl-tc{font-family:"Courier Prime","Courier New",monospace;font-size:13px;color:var(--muted);margin-top:2px!important}
.tl-cam{font-size:12px;color:var(--muted);margin-top:6px!important}
.tl-text{grid-area:text;display:flex;flex-direction:column;gap:2px;min-width:0}
.tl-dur{grid-area:dur;font:inherit;font-family:"Courier Prime","Courier New",monospace;width:100%;text-align:right;border:1px solid var(--line);border-radius:5px;background:var(--field-hover);color:inherit;padding:6px 8px}
.tl-dur:focus{outline:2px solid var(--slate);outline-offset:0;background:var(--field)}
.tl-empty{background:var(--card);border:1px dashed var(--line);border-radius:6px;padding:28px;text-align:center;color:var(--muted);margin-top:22px}
.tl-section{font-size:16px;font-weight:600;margin:32px 0 10px}
.tl-music{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tl-music li{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--c-mint);border-radius:6px;padding:10px 12px}
.tl-music p{margin:0}
.tl-music .hint{margin-top:2px}

/* Script view */
.sc-page{max-width:760px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:40px 48px 56px;box-shadow:0 12px 30px -22px var(--shadow)}
.sc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.sc-shot{margin-top:26px;font-family:"Courier Prime","Courier New",monospace}
.sc-slug{display:flex;justify-content:space-between;gap:12px;font-weight:700;font-size:15px;margin:0 0 6px}
.sc-slug span:last-child{font-weight:400;color:var(--muted);white-space:nowrap}
.sc-shot .f{font-family:"Courier Prime","Courier New",monospace;font-size:15px;line-height:1.5}
.sc-vo{width:60%;margin:8px 0 0 20%}
.sc-vo .f{margin:0;width:100%}
.sc-who{font-size:13px;color:var(--muted);margin:0 0 0 6px}
.sc-warn{margin:8px 0 0 20%;font-family:"DM Sans","Instrument Sans",system-ui,sans-serif;font-size:12.5px;color:var(--danger)}

/* Template sheet */
.sheet-back{position:fixed;inset:0;background:rgba(15,20,28,.45);display:grid;place-items:center;z-index:60;padding:16px}
.sheet{background:var(--card);color:var(--ink);border-radius:10px;width:min(440px,100%);max-height:80vh;overflow:auto;padding:20px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
.sheet h2{margin:0 0 4px;font-size:18px}
.sheet > p{margin:0 0 14px;color:var(--muted);font-size:13px}
.tpl{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.tpl > button:first-child{flex:1;text-align:left;background:none;border:0;padding:12px 14px}
.tpl > button:first-child:hover{background:var(--field-hover)}
.tpl strong{display:block;font-weight:600}
.tpl span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.tpl .tpl-del{background:none;border:0;color:var(--muted);padding:8px 12px;font-size:13px}
.tpl .tpl-del:hover{color:var(--danger)}
.sheet-sub{font-size:13px;font-weight:600;margin:16px 0 8px;color:var(--muted)}

/* Status */
[data-s="idea"]{--st:#9AA3AF} [data-s="scripted"]{--st:var(--c-sky)} [data-s="ready"]{--st:var(--c-tape)}
[data-s="shot"]{--st:var(--c-rose)} [data-s="edited"]{--st:var(--c-slate)} [data-s="published"]{--st:var(--c-mint)} [data-s="folder"]{--st:transparent}
.st-sel{appearance:none;-webkit-appearance:none;font:inherit;font-size:12.5px;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 22px;cursor:pointer;background:var(--card) radial-gradient(circle at 11px 50%,var(--st) 4px,transparent 4.5px) no-repeat}
.date-in{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:var(--card);color:var(--ink);color-scheme:light dark}
.row{flex-wrap:wrap}
.due{margin:0;font-size:12px;color:var(--muted)}
.due.over{color:var(--danger);font-weight:500}

/* Pipeline */
.pl-cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px;margin-top:22px;align-items:start}
.pl-col{background:color-mix(in srgb,var(--card) 50%,var(--table));border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.pl-col-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin:2px 2px 4px}
.pl-col-h .dot{width:9px;height:9px;border-radius:50%;background:var(--st)}
.pl-count{margin-left:auto;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.pl-item{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--st);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px}
.pl-open{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.pl-open strong{font-size:15px;font-weight:600}
.pl-open:hover strong{text-decoration:underline}
.pl-none{font-size:12.5px;color:var(--muted);margin:4px 2px}

/* Headings, sections, rich notes */
.t-heading{background:transparent;border-color:transparent;box-shadow:none}
.t-heading:hover,.t-heading.sel{border-color:var(--line)}
.t-heading .card-bar{opacity:0}
.t-heading:hover .card-bar,.t-heading.sel .card-bar{opacity:1}
.heading-text{font-size:22px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.t-frame{display:flex;flex-direction:column;background:color-mix(in srgb,var(--card) 30%,transparent);border:2px solid color-mix(in srgb,var(--ink) 40%,transparent);border-radius:12px;box-shadow:none}
.t-frame[data-color]{background:color-mix(in srgb,var(--accent) 9%,transparent);border:2px solid var(--accent)}
.t-frame .card-body{flex:1}
.frame-title{font-size:20px;font-weight:600}
.md{cursor:text;line-height:1.5;padding:2px 0;overflow-wrap:anywhere}
.md h3{font-size:16px;margin:2px 0 4px}
.md h4{font-size:14px;margin:8px 0 2px}
.md p{margin:0}
.md ul{margin:2px 0;padding-left:18px}
.md a{color:var(--slate)}
.md-gap{height:8px}
.star{background:none;border:0;color:var(--on-slate);opacity:.4;font-size:15px;padding:0 4px;line-height:1}
.star.on{opacity:1;color:var(--c-tape)}
.trans{font-size:12.5px;font-style:italic;color:var(--muted)}
.tl-must{color:#9A6B00;font-size:12px;font-weight:600;margin-top:4px!important}
:root[data-theme="dark"] .tl-must{color:var(--c-tape)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .tl-must{color:var(--c-tape)} }
.sc-trans{text-align:right;font-weight:700;margin:10px 0 0}

/* Media & files */
.player-v video{width:100%;max-height:520px;border-radius:4px;display:block;background:#000}
button.frame{width:100%;font:inherit}
.map-embed{width:100%;aspect-ratio:4/3;border:0;border-radius:4px;display:block;background:var(--frame)}
.file-row{display:flex;align-items:center;gap:10px}
.file-ic{width:40px;height:48px;flex-shrink:0;border-radius:4px;background:var(--frame);border:1px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--muted)}
.file-meta{flex:1;min-width:0;display:flex;flex-direction:column}
.file-meta strong{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Planning cards */
.field-row{display:flex;align-items:center;gap:8px}
.x-btn{background:none;border:0;color:var(--muted);width:24px;height:24px;border-radius:5px;padding:0;flex-shrink:0}
.x-btn:hover{background:var(--field);color:var(--ink)}
.x-btn:disabled{opacity:.3;cursor:default}
.row.nowrap{flex-wrap:nowrap}
.sp{flex:1}
.txt-btn.muted{color:var(--muted);font-weight:400}
.person{border-top:1px solid var(--line);padding:6px 0;display:flex;flex-direction:column;gap:2px}
.person:first-child{border-top:0}
.person .f{margin:0;width:100%;min-width:0}
.p-links{display:flex;gap:12px}
.sched{list-style:none;margin:4px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.blk{border:1px solid var(--line);border-left:3px solid var(--slate);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.blk.brk{border-left-color:var(--line);background:var(--field-hover)}
.blk-t{font-family:"Courier Prime","Courier New",monospace;font-weight:700;font-size:13px}
.blk .f{margin:0;width:100%;min-width:0}
.blk-m{width:64px;flex-shrink:0}
.must{font-size:12.5px}
.cal-head{justify-content:space-between}
.cal-title{font-size:14px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
.cal-day{min-height:42px;border:1px solid var(--line);background:var(--card);border-radius:4px;padding:2px;display:flex;flex-direction:column;align-items:stretch;gap:1px;overflow:hidden;text-align:left}
.cal-day.today{border-color:var(--slate);box-shadow:inset 0 0 0 1px var(--slate)}
.cal-n{font-size:11px;color:var(--muted)}
.cal-chip{font-style:normal;font-size:9.5px;line-height:1.35;border-radius:3px;padding:0 3px;background:var(--k);color:#10161F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-k="shoot"]{--k:var(--c-rose)} [data-k="edit"]{--k:var(--c-sky)} [data-k="v1"],[data-k="v2"]{--k:var(--c-tape)} [data-k="final"]{--k:var(--c-mint)} [data-k="publish"]{--k:var(--c-slate)} [data-k="other"]{--k:#B5BCC6}
.cal-add{margin-top:6px}
.cal-add .f{flex:1;min-width:90px;margin:0;width:auto;border:1px solid var(--line)}
.cal-kind{--st:var(--k)}
.cal-list{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:13px}
.cal-list li{display:flex;align-items:center;gap:8px}
.cal-list li > span:nth-child(2){flex:1}
.cal-dot{width:8px;height:8px;border-radius:50%;background:var(--k);flex-shrink:0}
.deliv li{gap:4px}
.deliv .date-in{flex-shrink:0;width:auto;max-width:130px}

/* Draw bar */
.drawbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--chrome);border:1px solid var(--line);border-radius:999px;z-index:15;box-shadow:0 8px 24px -14px var(--shadow)}
.pen{width:22px;height:22px;border-radius:50%;border:2px solid var(--chrome);box-shadow:0 0 0 1px var(--line);padding:0}
.pen.on{box-shadow:0 0 0 2px var(--slate)}
.db-btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px}
.db-btn.on{background:var(--field);border-color:var(--slate)}
.db-btn.primary{background:var(--slate);border-color:var(--slate);color:var(--card)}
body:not([data-mode="canvas"]) .drawbar{display:none!important}
.tool[aria-pressed="true"]{background:var(--field);color:var(--ink)}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--card);padding:10px 14px;border-radius:8px;display:flex;gap:14px;align-items:center;z-index:50;transition:opacity .18s,transform .18s;max-width:calc(100% - 24px)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:var(--c-tape);font-weight:600;padding:0}

@media (max-width:640px){
  .tools{left:8px;right:8px;top:auto;bottom:8px;transform:none;flex-direction:row;justify-content:space-between;overflow-x:auto}
  .tool{width:auto;flex:1;min-width:48px;font-size:11px}
  .zoom #zPct,.zoom #zIn,.zoom #zOut{display:none}
  .top{height:auto;flex-wrap:wrap;padding:6px 8px;gap:4px}
  #crumbs{flex:1 1 100%}
  .top-right{flex:1 1 100%;justify-content:space-between}
  .seg-toggle button{padding:5px 8px;font-size:13px}
  #timeline{padding:20px 12px 40px}
  .sc-page{padding:24px 18px 36px}
  .sc-vo,.sc-warn{width:auto;margin-left:10%}
  .tl-row{grid-template-columns:28px 1fr 76px;grid-template-areas:"move thumb dur" "move meta meta" "text text text";gap:10px}
  .tl-meta{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .tl-meta p{margin:0!important}
  #toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){ #toast{transition:none} }

/* ============ Milanote-style theme ============ */
:root{
  --table:#E9EAEC; --dot:rgba(0,0,0,.07); --chrome:#FFFFFF; --card:#FFFFFF; --ink:#1F2328; --muted:#6B7280;
  --line:#E1E3E6; --edge:rgba(0,0,0,.04); --shadow:rgba(0,0,0,.28); --field:#F1F2F4; --field-hover:#F6F7F8;
  --slate:#2B2E33; --slate-bar:#2B2E33; --on-slate:#FFFFFF; --frame:#F1F2F4; --wire:#8E949C; --sel:#3D7BF7;
  --card-shadow:0 1px 2px rgba(0,0,0,.10),0 2px 8px -3px rgba(0,0,0,.10);
  --serif:"Source Serif 4","Iowan Old Style",Georgia,"Times New Roman",serif;
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:14px; color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --table:#1E1F22; --dot:rgba(255,255,255,.06); --chrome:#26282C; --card:#2C2E33; --ink:#E8E9EB; --muted:#9CA3AF;
  --line:#3A3D43; --field:#34373D; --field-hover:#303338; --slate:#E8E9EB; --slate-bar:#3A3D43; --on-slate:#1F2328;
  --frame:#34373D; --wire:#7D838C; --sel:#5B93FA; --card-shadow:0 1px 2px rgba(0,0,0,.5),0 4px 12px -4px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --table:#1E1F22; --dot:rgba(255,255,255,.06); --chrome:#26282C; --card:#2C2E33; --ink:#E8E9EB; --muted:#9CA3AF;
  --line:#3A3D43; --field:#34373D; --field-hover:#303338; --slate:#E8E9EB; --slate-bar:#3A3D43; --on-slate:#1F2328;
  --frame:#34373D; --wire:#7D838C; --sel:#5B93FA; --card-shadow:0 1px 2px rgba(0,0,0,.5),0 4px 12px -4px rgba(0,0,0,.5); color-scheme:dark;
}
:focus-visible{outline-color:var(--sel)}
.date-in{color-scheme:inherit}
.open-link,.txt-btn,.md a{color:var(--sel)}
/* Undo / redo */
.icon-btn{width:32px;height:32px;border:0;background:none;border-radius:6px;display:grid;place-items:center;color:var(--muted);padding:0}
.icon-btn:hover:not(:disabled){background:var(--field);color:var(--ink)}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:640px){ #themeBtn{display:none!important} }
#themeBtn{width:32px;height:32px;border:0;background:none;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
#themeBtn:hover{background:var(--field);color:var(--ink)}
#themeBtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.menu-label{margin:4px 8px 2px;font-size:12px;color:var(--muted)}
.menu-sep{height:1px;background:var(--line);margin:6px 0}
.menu > button[aria-checked="true"]{font-weight:600}
.menu > button[aria-checked="true"]::after{content:"✓";float:right;color:var(--sel)}

/* Top bar: breadcrumbs left, serif board title centered */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);height:56px;background:var(--chrome);border-bottom:1px solid var(--line)}
.top-right{justify-self:end}
.crumb{font-size:13px;padding:4px 6px}
.sep{font-size:13px}
#boardTitle{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink);text-align:center;background:transparent;border:0;border-radius:6px;padding:4px 10px;min-width:8ch;max-width:46vw}
#boardTitle:hover{background:var(--field-hover)}
#boardTitle:focus{outline:none;background:var(--field)}
.seg-toggle{background:var(--field)}
.seg-toggle button{font-size:13px}

/* Left toolbar, flush like Milanote */
.tools{left:0;top:0;bottom:0;transform:none;max-height:none;width:68px;border:0;border-right:1px solid var(--line);border-radius:0;box-shadow:none;padding:8px 4px;gap:0;background:var(--chrome)}
.tool{width:60px;padding:8px 0 6px;font-size:10.5px;color:var(--muted);border-radius:6px}
.tool svg,.tool[data-type="shot"] svg{stroke:var(--muted);width:21px;height:21px}
.tool:hover svg,.tool[aria-pressed="true"] svg{stroke:var(--ink)}

/* Cards: flat white, soft shadow, no headers */
.card{border:0;border-radius:3px;box-shadow:var(--card-shadow)}
.card[data-color]{border-top:0;background:color-mix(in srgb,var(--accent) 18%,var(--card));box-shadow:inset 3px 0 0 var(--accent),var(--card-shadow)}
.card.sel{outline:2px solid var(--sel);outline-offset:1px}
.card.target{outline:2px dashed var(--sel)}
.card-kind{display:none}
.card-bar{position:absolute;top:4px;right:4px;min-height:0;padding:0;z-index:4;opacity:0;background:var(--card);border-radius:6px;cursor:default}
.card:hover .card-bar,.card.sel .card-bar{opacity:1}
@media (hover:none){ .card:hover .card-bar{opacity:0} .card.sel .card-bar{opacity:1} }
.card-body{padding:12px 14px}
.title{font-family:var(--serif);font-size:16px;font-weight:600}
.f::placeholder{opacity:.9}
.port{border-color:var(--sel)}
.todo input[type=checkbox]{accent-color:var(--ink)}
.wire .line{stroke-width:1.75}
.wire.sel .line{stroke:var(--sel)}
.menu{border-radius:6px}

/* Shot card: plain Milanote card with a slim header */
.t-shot{border:0}
.t-shot::before{display:none}
.t-shot .card-bar{position:static;opacity:1;background:transparent;color:var(--ink);padding:10px 6px 0 14px;font-family:var(--serif);border-radius:0;display:flex;align-items:center;gap:6px}
.t-shot .menu-btn{color:var(--muted)}
.t-shot .menu-btn:hover{background:var(--field)}
.t-shot .card-bar .f{color:var(--ink)}
.t-shot .card-bar .f:hover,.t-shot .card-bar .f:focus{background:var(--field)}
.t-shot .card-bar .f::placeholder{color:var(--muted);opacity:.8}
.shot-no{font-size:16px;font-weight:700}
.dur{font-family:"Inter",system-ui,sans-serif;font-size:12.5px;color:var(--muted)}
.star{color:var(--muted);opacity:.5}
.star.on{color:#E0A200;opacity:1}
.t-shot .card-body{padding-top:6px}
.frame{border:0;border-radius:2px}

/* Images and video: full bleed */
.t-image .card-body,.t-video .card-body{padding:0}
.t-image .frame{margin:0;border-radius:3px 3px 0 0}
.t-image .card-body > .f,.t-video .card-body > .f{margin:6px 8px 8px;width:calc(100% - 16px)}
.player-v video{border-radius:3px 3px 0 0}
.player-v button.frame{border-radius:3px 3px 0 0;margin:0}

/* Headings */
.t-heading{background:var(--card);border:0;box-shadow:var(--card-shadow)}
.t-heading .card-bar{opacity:0}
.heading-text{font-family:var(--serif);font-size:19px;font-weight:600}

/* Sections look like Milanote columns */
.t-frame{background:color-mix(in srgb,var(--card) 55%,var(--table));border:0;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.t-frame[data-color]{background:color-mix(in srgb,var(--accent) 12%,var(--card));border:0;box-shadow:inset 0 3px 0 var(--accent),0 1px 2px rgba(0,0,0,.08)}
.t-frame .card-body{padding-top:14px}
.frame-title{font-family:var(--serif);font-size:18px;font-weight:600;text-align:center}
.frame-count{margin:0;text-align:center;font-size:12px;color:var(--muted)}

/* Board cards: colored icon tile + name + counts */
.bc{display:flex;align-items:center;gap:12px}
.bc-ic{width:44px;height:44px;flex-shrink:0;border:0;border-radius:8px;padding:0;display:grid;place-items:center;background:var(--bc)}
.bc-ic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8}
.bc-ic:hover{filter:brightness(1.07)}
.bc-txt{flex:1;min-width:0}
.bc-txt .f{font-size:14.5px;font-weight:600;font-family:"Inter",system-ui,sans-serif}
.t-board .row{margin-top:10px}
.icon-pick{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:6px 4px;border-bottom:1px solid var(--line);margin-bottom:4px}
.icon-pick button{width:26px;height:26px;border:0;border-radius:6px;background:var(--field);display:grid;place-items:center;padding:0}
.icon-pick button[aria-pressed="true"]{background:var(--sel)}
.icon-pick svg{width:15px;height:15px;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.icon-pick button[aria-pressed="true"] svg{stroke:#fff}
.bc-ic svg{stroke-linecap:round;stroke-linejoin:round}

/* Workflow steps */
[data-stage="todo"]{--stg:#4A4F57} [data-stage="doing"]{--stg:#E8792B} [data-stage="done"]{--stg:#3DBA4E} [data-stage="urgent"]{--stg:#E5484D}
.t-step{background:transparent;box-shadow:none;border:0}
.t-step .card-body{padding:4px 0;align-items:center;text-align:center;gap:2px}
.step-tile{width:64px;height:64px;border:0;border-radius:10px;background:var(--stg);color:#fff;font:600 34px/1 "Inter",system-ui,sans-serif;display:grid;place-items:center;box-shadow:0 2px 6px -2px rgba(0,0,0,.35);transition:background .15s}
.step-tile:hover{filter:brightness(1.08)}
.step-name{margin:6px 0 0;font-size:12.5px;font-weight:600;letter-spacing:.02em}
.step-count{font-size:11.5px}
.step-sel{appearance:none;-webkit-appearance:none;font:inherit;font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:2px 8px 2px 18px;margin-top:4px;color:var(--ink);background:var(--card) radial-gradient(circle at 9px 50%,var(--stg) 3.5px,transparent 4px) no-repeat;cursor:pointer}
.prog-sum{margin:2px 0 6px;font-size:13px}
.prog-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--field);gap:2px}
.prog-bar i{background:var(--stg);flex-basis:0}
.prog-legend{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600}
.prog-legend li{display:flex;align-items:center;gap:8px;color:var(--stg)}
.prog-legend li[data-stage="todo"]{color:var(--muted)}
.prog-legend i{width:10px;height:10px;border-radius:3px;background:var(--stg)}
.prog-legend span{flex:1}
.prog-legend b{color:var(--ink);font-variant-numeric:tabular-nums}

/* Line styles, free arrows, alignment guides */
#guides{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;z-index:99999}
#guides line{stroke:#E5484D;stroke-width:1;vector-effect:non-scaling-stroke}
.wire-bar{position:absolute;display:flex;align-items:center;gap:4px;padding:4px;background:var(--card);border-radius:8px;box-shadow:0 6px 18px -6px rgba(0,0,0,.35),0 0 0 1px var(--line);z-index:99999;transform-origin:50% 100%;white-space:nowrap}
.wire-bar button{border:0;background:none;border-radius:5px;height:28px;min-width:28px;padding:0 6px;display:grid;place-items:center;color:var(--ink)}
.wire-bar button:hover{background:var(--field)}
.wire-bar svg{width:30px;height:14px;overflow:visible}
.wire-bar .wb-col{width:16px;height:16px;min-width:0;border-radius:50%;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.wire-bar .wb-col[aria-pressed="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--sel)}
.wire-bar .wb-del{color:var(--danger);font-size:18px}

const esc = s => s.replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

    let m = l.match(/^\s*(?:[-*•]\s+)?\[( |x|X)\]\s*(.*)$/);
    if (m) {
      if (!inList) { out += '<ul>'; inList = true; }
      const on = m[1] !== ' ';
      out += `<li class="md-check${on ? ' done' : ''}"><input type="checkbox" data-ln="${ln}"${on ? ' checked' : ''} aria-label="Done"><span>${inlineMd(m[2])}</span></li>`;

    }
    m = l.match(/^\s*[-*•]\s+(.*)$/);
    if (m) { if (!inList) { out += '<ul>'; inList = true; } out += `<li>${inlineMd(m[1])}</li>`; continue; }
    if (inList) { out += '</ul>'; inList = false; }
    if ((m = l.match(/^##\s+(.*)$/))) out += `<h4>${inlineMd(m[1])}</h4>`;
    else if ((m = l.match(/^#\s+(.*)$/))) out += `<h3>${inlineMd(m[1])}</h3>`;
    else if (!l.trim()) out += '<div class="md-gap"></div>';

  }
  return out + (inList ? '</ul>' : '');
}

function preview(boardId) {
  const box = h('div', { class: 'preview', 'aria-hidden': 'true' });
  const cs = cardsOf(boardId); if (!cs.length) return box;
  const EH = { comment: 110, song: 150, tabs: 220, note: 90, shot: 360, link: 140, music: 170, image: 200, todo: 180, board: 300, heading: 40, frame: 380, video: 240, file: 80, location: 240, contacts: 200, schedule: 420, calendar: 400, deliverables: 180 };
  const hOf = c => (c.type === 'frame' ? (c.h || 380) : EH[c.type] || 150);
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  cs.forEach(c => { x1 = Math.min(x1, c.x); y1 = Math.min(y1, c.y); x2 = Math.max(x2, c.x + c.w); y2 = Math.max(y2, c.y + hOf(c)); });
  const W = x2 - x1 || 1, H = y2 - y1 || 1;
  cs.forEach(c => {
    const b = h('i', { class: 'pv pv-' + c.type });
    b.style.left = 6 + (c.x - x1) / W * 88 + '%'; b.style.top = 8 + (c.y - y1) / H * 84 + '%';
    b.style.width = c.w / W * 88 + '%'; b.style.height = hOf(c) / H * 84 + '%';
    box.append(b);
  });
  return box;
}

function buildCard(c) {

  if (c.size) el.dataset.size = c.size;
  place(el, c);
  const menuBtn = h('button', { class: 'menu-btn', 'aria-label': 'Card options', 'aria-haspopup': 'menu' });
  menuBtn.innerHTML = '<svg viewBox="0 0 16 16"><circle cx="3" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="13" cy="8" r="1.5"/></svg>';
  menuBtn.addEventListener('click', e => { e.stopPropagation(); openMenu && openMenu.dataset.for === c.id ? closeMenu() : showMenu(c, el); });
  const bar = h('div', { class: 'card-bar' }, h('span', { class: 'card-kind' }, LABELS[c.type]), h('div', { class: 'bar-extra' }), menuBtn);
  const body = h('div', { class: 'card-body' });
  el.append(bar, body);
  BUILDERS[c.type](c, body, bar);
  const badge = h('span', { class: 'lock-badge', title: 'Locked in place', 'aria-label': 'Locked' });
  badge.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  el.append(h('button', { class: 'port', 'aria-label': 'Drag to connect to another card', title: 'Drag to connect' }), h('div', { class: 'rz', 'aria-hidden': 'true' }), badge);
  el.addEventListener('pointerdown', cardDown);
  el.addEventListener('focusin', () => select(c.id));
  el.addEventListener('dblclick', e => { if (c.type === 'board' && !e.target.closest('input,textarea,button')) openBoard(c.data.child); });
  el.addEventListener('dragover', e => { if ((c.type === 'shot' || c.type === 'image') && [...e.dataTransfer.types].includes('Files')) { e.preventDefault(); e.stopPropagation(); } });
  el.addEventListener('drop', async e => {
    const f = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
    if ((c.type === 'shot' || c.type === 'image') && f) { e.preventDefault(); e.stopPropagation(); stage.classList.remove('drop'); el.querySelector('.frame').setImage(await imageToData(f)); }
  });
  ro.observe(el);
  return el;
}

/* ---------- Menu ---------- */
let openMenu = null;
function closeMenu() { if (openMenu) { openMenu.remove(); openMenu = null; } }
function placeFloatingMenu(m, anchor) {
  const vw = window.innerWidth, vh = window.innerHeight;
  if (vw <= 640) { m.classList.add('sheet-menu'); return; }
  const r = anchor.getBoundingClientRect(), mw = m.offsetWidth, mh = Math.min(m.scrollHeight, vh - 16);
  let left = Math.min(Math.max(8, r.right - mw), vw - mw - 8);
  let top = r.bottom + 6;
  if (top + mh > vh - 8) top = r.top - mh - 6 >= 8 ? r.top - mh - 6 : Math.max(8, vh - mh - 8);
  m.style.left = left + 'px'; m.style.top = top + 'px';
}
document.addEventListener('pointerdown', e => { if (openMenu && !e.target.closest('.menu,.menu-btn')) closeMenu(); }, true);
window.addEventListener('resize', () => closeMenu());
document.getElementById('stage').addEventListener('wheel', () => closeMenu(), { passive: true });
function showMenu(c, el) {

  const sw = h('div', { class: 'swatches' });
  COLORS.forEach(col => sw.append(h('button', { class: 'sw', 'data-c': col, 'aria-label': col ? `Color: ${col}` : 'No color', onclick: () => {

    if (f.type.startsWith('image/')) addCard('image', p, { img: await imageToData(f), cap: '' });
    else if (f.type.startsWith('audio/')) {
      const d = await audioToData(f);

/* ---------- Script view ---------- */
const WPM = 150;
const words = s => (String(s || '').trim().match(/\S+/g) || []).length;
const readSecs = s => words(s) * 60 / WPM;
function renderScript() {
  tlEl.innerHTML = '';
  const b = state.items.get(state.board);
  const { shots } = runtime(state.board);
  const page = h('article', { class: 'sc-page' });
  page.append(h('div', { class: 'sc-head' },
    h('div', {}, h('h1', { class: 'tl-title' }, b?.name || 'Untitled video'), h('p', { class: 'tl-stats', id: 'scStats' })),
    h('div', { class: 'tl-actions' }, h('button', { class: 'btn', onclick: exportScript }, 'Export script'))));
  if (!shots.length) page.append(h('p', { class: 'tl-empty' }, 'No shots on this board yet. Add shots on the canvas or in the timeline, and their descriptions and voiceover will read here as a script.'));
  shots.forEach(s => {
    const desc = txt(s, 'desc', 'What happens in this shot');
    const vo = txt(s, 'vo', 'Voiceover or dialogue');
    desc.addEventListener('input', updateScript); vo.addEventListener('input', updateScript);
    page.append(h('section', { class: 'sc-shot', 'data-id': s.id },
      h('p', { class: 'sc-slug' }, h('span', {}, `SHOT ${s.data.num || '?'}` + (s.data.cam ? ` — ${s.data.cam.toUpperCase()}` : '')), h('span', { class: 'sc-tc' })),
      desc,
      h('div', { class: 'sc-vo' }, h('p', { class: 'sc-who' }, 'Voiceover'), vo),
      h('p', { class: 'sc-warn', hidden: true }),
      s.data.trans ? h('p', { class: 'sc-trans' }, s.data.trans.toUpperCase() + ':') : null));
  });
  tlEl.append(page);

  requestAnimationFrame(() => tlEl.querySelectorAll('textarea').forEach(autosize));
}
function updateScript() {
  const { shots, durs, total } = runtime(state.board);
  let t = 0, w = 0, over = 0;
  shots.forEach((s, i) => {
    const d = durs[i], sec = tlEl.querySelector(`.sc-shot[data-id="${s.id}"]`);
    w += words(s.data.vo);
    if (sec) {
      sec.querySelector('.sc-tc').textContent = d == null ? fmt(t) : `${fmt(t)} to ${fmt(t + d)}`;
      const warn = sec.querySelector('.sc-warn'), r = readSecs(s.data.vo);
      const long = d != null && r > d + 0.5;
      if (long) { over++; warn.textContent = `This voiceover takes about ${Math.round(r)} seconds to read, but the shot is ${Math.round(d)}. Trim the line or lengthen the shot.`; }
      warn.hidden = !long;
    }
    t += d || 0;
  });
  const st = $('#scStats');
  if (st) st.textContent = shots.length
    ? `${w} words of voiceover, about ${fmt(w * 60 / WPM)} read aloud against ${fmt(total)} of shots.` + (over ? ` ${over} ${over === 1 ? 'shot runs' : 'shots run'} long.` : '')
    : '';
}
function exportScript() {
  const b = state.items.get(state.board), { shots, durs, total } = runtime(state.board);
  if (!shots.length) { toast('Add a shot before exporting a script.'); return; }
  let t = 0;
  const out = [`# ${b?.name || 'Untitled video'}`, '', `Runtime: ${fmt(total)}`, ''];
  shots.forEach((s, i) => {
    const d = durs[i];
    out.push(`## Shot ${s.data.num || '?'}${s.data.cam ? ` (${s.data.cam})` : ''}, ${d == null ? fmt(t) : fmt(t) + ' to ' + fmt(t + d)}`, '');
    if (s.data.desc) out.push(s.data.desc, '');
    if (s.data.vo) out.push(...s.data.vo.split('\n').map(l => '> ' + l), '');
    if (s.data.trans) out.push(`*Transition: ${s.data.trans}*`, '');

  const DAY1 = new Date(2026, 9, 1);                 /* Day 1 = Thu 1 Oct 2026 */
  const WEEK1 = new Date(DAY1); WEEK1.setDate(DAY1.getDate() - DAY1.getDay());   /* its Sunday */
  const dayNo = n => Math.round((addD(n) - DAY1) / 864e5) + 1;
  const epNo = Math.floor(Math.round((sun - WEEK1) / 864e5) / 7) + 1;
  const drop = addD(11), md = d => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  const WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const epLabel = epNo >= 1 ? `Episode ${epNo}` : 'Episode';
  const nb = add({ id: uid(), kind: 'board', name: `${epLabel}: week of ${md(sun)}`, parent: state.board, view: null, status: 'idea', due: isoDay(drop) });
  const B = nb.id;

  mk(B, 'note', 14, 80, { text: `**Week:** ${md(sun)} to ${md(addD(6))}\n**Drops:** Thursday, ${md(drop)}\n**Target length:** 25 to 35 min\n\n## Weekly challenge\nThe small goal this week that builds toward the monthly challenge.\n\n## Monthly challenge\ne.g. October: vlog every day` }, 272);

    { d: isoDay(addD(7)), kind: 'edit', label: 'Edit' }, { d: isoDay(addD(9)), kind: 'v1', label: 'V1' }] }, 300);

const slug = s => (s || 'untitled').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'untitled';
const blobToBase64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
async function offerFile(filename, data, doneMsg) {
  // Packaged Android app (Capacitor): write to cache, then open the share sheet to save or send it
  const cap = window.Capacitor;
  if (cap?.isNativePlatform?.()) {
    const FS = cap.Plugins?.Filesystem, SH = cap.Plugins?.Share;
    if (!FS || !SH) { toast('Saving files needs the Filesystem and Share plugins in the Android build.'); return; }
    try {
      const { uri } = await FS.writeFile({ path: filename, data: await blobToBase64(data instanceof Blob ? data : new Blob([data])), directory: 'CACHE' });
      await SH.share({ title: filename, url: uri, dialogTitle: 'Save or share ' + filename });
    } catch (err) { if (!/cancel/i.test(String(err?.message || err))) toast('That file couldn\'t be saved.'); }
    return;
  }
  const cl = window.claude;
  if (cl && typeof cl.use === 'function') {
    let ns = null;
    try { ns = await cl.use('downloads'); } catch (e) {}
    if (!ns) { toast('Saving files isn\'t available in this view.'); return; }
    try { const r = await ns.save({ filename, data: new Blob([data]) }); if (r?.status === 'saved') toast(doneMsg); }
    catch (err) {
      if (err?.code === 'declined') return;
      if (err?.code === 'rate_limited') toast('A save prompt is already open.');
      else toast('That file couldn\'t be saved here.');
    }
    return;
  }
  const url = URL.createObjectURL(new Blob([data]));
  const a = h('a', { href: url, download: filename }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast(doneMsg);
}

  const rows = [['Shot', 'Must get', 'Shot type', 'Start', 'Duration', 'Description', 'Voiceover / dialogue', 'Transition']];
  shots.forEach((s, i) => { const d = durs[i]; rows.push([s.data.num, s.data.must ? 'Yes' : '', s.data.cam, fmt(t), d == null ? '' : fmt(d), s.data.desc, s.data.vo, s.data.trans || '']); t += d || 0; });
  const csv = '\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  offerFile(`${slug(state.items.get(state.board)?.name)}-shot-list.csv`, csv, 'Shot list saved');
}
function importBackup(targetId) {
  pickFile('application/json,.json', async f => {
    let d;
    try { d = JSON.parse(await f.text()); } catch (e) { toast('That file isn\'t a valid backup.'); return; }
    if (d?.app !== 'storyboard' || !Array.isArray(d.items)) { toast('That file isn\'t a Storyboard backup.'); return; }
    const target = targetId && state.items.get(targetId) ? targetId : state.board;
    const map = {}, m = id => (id ? (map[id] || (map[id] = uid())) : id);
    const roots = [];
    d.items.forEach(it => {
      if (!it || !it.id) return;
      const n = structuredClone(it); n.id = m(it.id);
      if (n.kind === 'board') { n.view = null; if (!n.parent) { n.parent = target; roots.push(n); } else if (n.parent !== TPL_PARENT) n.parent = m(n.parent); }
      else if (n.kind === 'card') { n.board = m(n.board); n.data = n.data || {}; if (n.type === 'board' || n.type === 'step') n.data.child = m(n.data.child); if (n.inTab) n.inTab = { ...n.inTab, card: m(n.inTab.card) }; n.z = ++zTop; }
      else if (n.kind === 'conn') { n.board = m(n.board); n.from = m(n.from); n.to = m(n.to); }
      else if (n.kind === 'stroke') { n.board = m(n.board); }
      else return;
      add(n);
    });
    const joined = await cs3JoinImported(d.items, map);
    if (joined) setTimeout(() => toast(`${joined} ${joined === 1 ? 'board' : 'boards'} joined ${joined === 1 ? 'its episode or clip' : 'their episodes and clips'} — find them in Videos.`), 2600);
    if (!roots.length) { renderBoard(); toast('Templates imported.'); return; }
    const r = stage.getBoundingClientRect(), c0 = toWorld(r.left + r.width / 2, r.top + r.height / 2);
    roots.forEach((b, i) => {
      b.name = (b.name || 'Imported boards') + ' (imported)'; save(b, true);
      if (target === state.board) mk(state.board, 'board', snap(c0.x - 110 + i * 30), snap(c0.y - 120 + i * 30), { child: b.id });
      else { const p = nextSpot(target); mk(target, 'board', p.x, p.y, { child: b.id }); }
    });
    sideOpen.add(target);
    if (state.mode === 'timeline') setMode('canvas'); else renderBoard();
    toast(target !== state.board ? `Imported into ${state.items.get(target)?.name || 'Home'}.` : d.kind === 'board' ? 'Board imported onto this canvas.' : 'Backup imported as a board on this canvas.');
  });
}
function setBoardLock(on) {
  const cs = cardsOf(state.board); if (!cs.length) { toast('This board has no cards yet.'); return; }
  cs.forEach(c => { if (!!c.locked !== on) { c.locked = on; save(c); } });
  if (state.mode !== 'canvas') setMode('canvas'); else renderBoard();

}

/* ---------- Start ---------- */
function seed() {
  const root = add({ id: uid(), kind: 'board', name: 'My videos', parent: null, view: null });
  const sample = add({ id: uid(), kind: 'board', name: 'Sample video', parent: root.id, view: null });
  mk(root.id, 'note', 0, 0, { text: 'Each board is one video. Open the sample to see a storyboard, then add a board for your next video.\n\nDouble-click empty space to drop a note. Drag the dot on a card\'s right edge onto another card to connect them.' }, 280);
  mk(root.id, 'board', 320, 0, { child: sample.id });
  const s1 = mk(sample.id, 'shot', 0, 0, { num: '1', dur: '0:05', cam: 'Wide', desc: 'Cold open. Establishing shot of the workspace with a slow push in.', vo: 'Here\'s the part nobody tells you about…' });
  const s2 = mk(sample.id, 'shot', 360, 0, { num: '2', dur: '0:04', cam: 'Close-up', desc: 'Hands on the problem. Show the one detail that sets up the hook.', vo: '' });
  const s3 = mk(sample.id, 'shot', 720, 0, { num: '3', dur: '0:08', cam: 'Medium', desc: 'Talking head. Deliver the promise of the video.', vo: 'By the end of this, you\'ll know exactly how to fix it.' });
  const m = mk(sample.id, 'music', 0, 470, { title: 'Intro bed', artist: '', cue: 'Under shots 1 to 3, ducked under the voiceover', url: '' });
  mk(sample.id, 'link', 360, 470, { title: 'Pacing reference', url: '', note: 'Paste a video whose cold open you want to match.' });
  mk(sample.id, 'todo', 720, 470, { title: 'Before the shoot', items: [{ t: 'Charge batteries and clear cards', done: false }, { t: 'Record 30 seconds of room tone', done: false }, { t: 'Grab B-roll of the details', done: false }] });
  const n = mk(sample.id, 'note', 1080, 0, { text: 'Hook idea: open on the finished result, then rewind to the start.' }, 240);
  n.color = 'tape'; DB.put(n);
  [[s1, s2], [s2, s3], [m, s1]].forEach(([a, b]) => add({ id: uid(), kind: 'conn', board: sample.id, from: a.id, to: b.id }));
  return root;
}

/* ---------- Creator Studio 3: an episode's board is its shots ----------
   Each of the episode's sequences is a Section (data.beat = its id) and each
   of its shots a shot card inside it (data.ref = { beat, id }). The episode
   owns the shots; app/js/boardsync.js reads and writes them. On opening, the
   board catches up with the episode (new sections go below what is there,
   new shots at the end of their row — nothing you placed is moved). Edits to
   a linked card go back to the episode half a second later. */
const cs3Parent = () => { try { return window.parent !== window ? window.parent : null; } catch (e) { return null; } };
const cs3Api = () => { const P = cs3Parent(); return P && P.BoardSync ? P.BoardSync : null; };
const cs3Video = boardId => { const b = state.items.get(boardId); return b && b.video && b.video.type === 'vlog' ? b.video : null; };
const CS3 = { SHOT_W: 300, GAP: 30, ROW_H: 470, PAD: 24, HEAD: 64 };
let cs3Pulling = false;
function frameOfCard(c) {
  const cx = c.x + (c.w || CS3.SHOT_W) / 2, cy = c.y + 40;
  return cardsOf(c.board).filter(f => f.type === 'frame' && f.data && f.data.beat)
    .find(f => cx >= f.x && cx <= f.x + f.w && cy >= f.y && cy <= f.y + (f.h || 380)) || null;
}
function cs3Quiet(c) { cs3Pulling = true; try { save(c, true); } finally { cs3Pulling = false; } }
function cs3Rebuild(c) { const el = cardEl(c.id); if (el) { el.replaceWith(buildCard(c)); scheduleWires(); } }
function cs3Badge(c) {
  const p = c.data.prog || {};
  const t = p.done ? 'In the can' : p.sent ? `${p.got}/${p.want} angles` : 'Not shot';
  return h('span', { class: 'cs3-prog' + (p.done ? ' done' : p.got ? ' part' : ''), title: 'This shot is in the episode. Progress comes from Shoot mode.' }, t);
}
async function cs3FillStill(c, refId) {
  const api = cs3Api(); if (!api) return;
  const d = await api.stillData(refId);
  if (!d || c.data.img) return;
  c.data.img = d; c.data.refId = refId; cs3Quiet(c); cs3Rebuild(c);
}
function cs3Still(c, refId) {
  const api = cs3Api(), video = cs3Video(c.board);
  if (api && video && c.type === 'shot' && c.data.ref) api.setStill(video, c.data.ref, refId);
}
function cs3AfterOpen(id) { if (cs3Video(id)) cs3Pull(id); }
async function cs3Pull(boardId) {
  const api = cs3Api(), video = cs3Video(boardId); if (!api || !video) return;
  let m; try { m = await api.model(video); } catch (e) { console.warn('Board sync: could not read the episode', e); return; }
  if (!m || state.board !== boardId) return;
  cs3Pulling = true;
  try {
    const cards = cardsOf(boardId);
    const frames = new Map(cards.filter(c => c.type === 'frame' && c.data.beat).map(c => [c.data.beat, c]));
    const shotCards = new Map(cards.filter(c => c.type === 'shot' && c.data.ref).map(c => [c.data.ref.id, c]));
    const live = new Set();
    let nextY = cards.length ? Math.max(...cards.map(c => c.y + (c.type === 'frame' ? (c.h || 380) : 360))) + 80 : 0;
    nextY = Math.ceil(nextY / GRID) * GRID;
    for (const beat of m.beats) {
      let f = frames.get(beat.id);
      if (!f) {
        const width = CS3.PAD * 2 + Math.max(3, beat.shots.length) * (CS3.SHOT_W + CS3.GAP) - CS3.GAP;
        f = mk(boardId, 'frame', 0, nextY, { title: beat.act ? `${beat.title}` : beat.title, beat: beat.id }, width);
        f.h = CS3.ROW_H; save(f, true);
        nextY += CS3.ROW_H + 60;
      } else if (f.data.title !== beat.title) { f.data.title = beat.title; save(f, true); }
      beat.shots.forEach((s, j) => {
        live.add(s.id);
        const prog = { got: s.got, want: s.want, done: s.done, sent: s.sent };
        let c = shotCards.get(s.id);
        if (!c) {
          const inRow = cardsOf(boardId).filter(x => x.type === 'shot' && x.id !== f.id && frameOfCard(x) === f);
          const x = inRow.length ? Math.max(...inRow.map(x => x.x + x.w)) + CS3.GAP : f.x + CS3.PAD;
          c = mk(boardId, 'shot', x, f.y + CS3.HEAD, { num: String(j + 1), dur: '', cam: s.cam, desc: s.text, vo: '', trans: '', must: false,
            ref: { beat: beat.id, id: s.id }, prog }, CS3.SHOT_W);
          if (x + CS3.SHOT_W + CS3.PAD > f.x + f.w) { f.w = x + CS3.SHOT_W + CS3.PAD - f.x; save(f, true); }
          if (s.refs && s.refs[0]) cs3FillStill(c, s.refs[0]);
        } else {
          let ch = false;
          const el = cardEl(c.id), focused = !!(el && el.contains(document.activeElement));
          if (!focused && (c.data.desc || '') !== s.text) { c.data.desc = s.text; ch = true; }
          if (!focused && (c.data.cam || '') !== s.cam) { c.data.cam = s.cam; ch = true; }
          if (c.data.ref.beat !== beat.id) { c.data.ref.beat = beat.id; ch = true; }
          if (c.data.num !== String(j + 1)) { c.data.num = String(j + 1); ch = true; }   /* numbered in sequence order */
          if (JSON.stringify(c.data.prog || null) !== JSON.stringify(prog)) { c.data.prog = prog; ch = true; }
          if (!c.data.img && s.refs && s.refs[0]) cs3FillStill(c, s.refs[0]);
          if (ch) save(c, true);
        }
      });
    }
    shotCards.forEach((c, id) => { if (!live.has(id)) { delete c.data.ref; delete c.data.prog; save(c, true); } });
    const beats = new Set(m.beats.map(b => b.id));
    frames.forEach((f, id) => { if (!beats.has(id)) { delete f.data.beat; save(f, true); } });
  } finally { cs3Pulling = false; }
  if (state.board === boardId) { renderBoard(); resetHistory(); }
}
const cs3Dirty = new Set(), cs3Snap = new Map(); let cs3T;
function cs3Changed(item) {
  if (cs3Pulling || !item || item.kind !== 'card' || !cs3Video(item.board)) return;
  cs3Dirty.add(item.id); clearTimeout(cs3T); cs3T = setTimeout(cs3Push, 500);
}
async function cs3Push() {
  const api = cs3Api(); if (!api) return;
  const ids = [...cs3Dirty]; cs3Dirty.clear();
  const rows = new Map();
  for (const id of ids) {
    const c = state.items.get(id); if (!c) continue;
    const video = cs3Video(c.board); if (!video) continue;
    try {
      if (c.type === 'frame' && c.data.beat) { await api.renameBeat(video, c.data.beat, c.data.title); continue; }
      if (c.type !== 'shot') continue;
      const f = frameOfCard(c);
      if (c.data.ref) {
        const r = await api.saveShot(video, c.data.ref, { text: c.data.desc || '', cam: c.data.cam || '' });
        if (r === 'missing') {
          const snap = cs3Snap.get(c.data.ref.id);
          if (snap) { await api.addShot(video, snap.beat, null, snap); cs3Snap.delete(c.data.ref.id); }
          else { delete c.data.ref; delete c.data.prog; cs3Quiet(c); cs3Rebuild(c); continue; }
        }
        if (f && f.data.beat !== c.data.ref.beat) { await api.moveShot(video, c.data.ref.id, f.data.beat); c.data.ref.beat = f.data.beat; cs3Quiet(c); }
        rows.set(c.data.ref.beat, c.board);
      } else if (f && (c.data.desc || '').trim()) {
        const sid = await api.addShot(video, f.data.beat, { text: c.data.desc, cam: c.data.cam || '' });
        if (sid) {
          c.data.ref = { beat: f.data.beat, id: sid }; c.data.prog = { got: 0, want: 1, done: false, sent: false };
          cs3Quiet(c); cs3Rebuild(c); rows.set(f.data.beat, c.board);
          if (c.data.refId) cs3Still(c, c.data.refId);
        }
      }
    } catch (e) { console.warn('Board sync: could not save', e); }
  }
  for (const [beat, board] of rows) {
    const order = cardsOf(board).filter(x => x.type === 'shot' && x.data.ref && x.data.ref.beat === beat)
      .sort((a, b) => (a.x - b.x) || (a.y - b.y)).map(x => x.data.ref.id);
    try { await api.reorder(cs3Video(board), beat, order); } catch (e) {}
    order.forEach((sid, i) => {
      const c = cardsOf(board).find(x => x.type === 'shot' && x.data.ref && x.data.ref.id === sid);
      if (c && c.data.num !== String(i + 1)) { c.data.num = String(i + 1); cs3Quiet(c); cs3Rebuild(c); }
    });
  }
}
function cs3Deleting(ids) {
  const api = cs3Api(); if (!api) return;
  const cards = ids.map(id => state.items.get(id)).filter(c => c && c.kind === 'card' && cs3Video(c.board));
  if (cards.some(c => c.type === 'frame' && c.data.beat))
    setTimeout(() => toast('Sections come from the episode, so this one will be back next time. To remove it, delete the sequence in the episode.'), 50);
  (async () => {
    for (const c of cards) {
      if (c.type !== 'shot' || !c.data.ref) continue;
      const r = await api.removeShot(cs3Video(c.board), c.data.ref.id);
      if (r && r.removed) cs3Snap.set(c.data.ref.id, r.snapshot);
      else if (r && r.reason === 'footage') toast('That shot has footage, so it stays in the episode. It will be back on the board next time.');
    }
  })();
}
window.CS3Sync = { pull: cs3Pull, push: cs3Push, frameOfCard };

/* ---------- Creator Studio 3: bringing Storyboard boards home ----------
   After a Storyboard backup is imported, a board that was linked to an
   episode in Creator Studio v2 (the episode kept its id as boardId), or that
   has the same name as an episode or clip, is folded into that video's own
   board: its cards, lines, ink and sub-boards move across, below anything
   already there. The rest stay where the import put them. */
async function cs3JoinImported(oldItems, map) {
  const P = cs3Parent(); if (!P || !P.Store) return 0;
  let vl = [], cl = [];
  try { [vl, cl] = await Promise.all([P.Store.all('vlogs').then(r => r.values), P.Store.all('clips').then(r => r.values)]); } catch (e) { return 0; }
  const norm = s => String(s || '').replace(/\s*\(imported\)\s*$/i, '').trim().toLowerCase();
  let joined = 0;
  for (const it of oldItems) {
    if (!it || it.kind !== 'board' || it.isFolder || !it.parent || it.parent === TPL_PARENT) continue;
    const nb = state.items.get(map[it.id]); if (!nb) continue;
    const v = vl.find(x => x.boardId === it.id) || vl.find(x => norm(x.title) && norm(x.title) === norm(it.name));
    const c = v ? null : cl.find(x => norm(x.title) && norm(x.title) === norm(it.name));
    if (!v && !c) continue;
    const type = v ? 'vlog' : 'clip', src = v || c;
    const bid = ensureVideoBoard(type, src.id, { name: src.title || it.name,
      status: c && P.BoardLink ? P.BoardLink.statusFor(c.stage) : '' });
    if (!bid || bid === nb.id) continue;
    const vb = state.items.get(bid);
    if (v && nb.status && nb.status !== 'folder' && (!vb.status || vb.status === 'idea')) { vb.status = nb.status; }
    if (nb.due && !vb.due) vb.due = nb.due;
    save(vb, true);
    const existing = cardsOf(bid);
    const dy = existing.length ? Math.max(...existing.map(e => e.y + (e.type === 'frame' ? (e.h || 380) : 400))) + 120 : 0;
    all().filter(x => x.board === nb.id).forEach(x => {
      x.board = bid;
      if (x.kind === 'card') x.y += dy;
      else if (x.kind === 'conn') { if (x.fy != null) x.fy += dy; if (x.ty != null) x.ty += dy; }
      else if (x.kind === 'stroke') x.pts = (x.pts || []).map(([px, py]) => [px, py + dy]);
      save(x, true);
    });
    all().filter(x => x.kind === 'board' && x.parent === nb.id).forEach(x => { x.parent = bid; save(x, true); });
    all().filter(x => x.kind === 'card' && (x.type === 'board' || x.type === 'step') && x.data && x.data.child === nb.id)
      .forEach(x => { x.data.child = bid; save(x, true); });
    remove(nb.id);
    joined++;
  }
  return joined;
}

/* ---------- Creator Studio 3: every video has its own board ----------
   The app opens this page with #video=vlog:<id> (an episode) or
   #video=clip:<id>, plus the video's name, status and due date. The board for
   that video has a fixed id, so asking twice opens the same board; it sits in
   a "Videos" folder under the root. Name, status and due date come from the
   video every time — the video is where they are owned. */
const VIDEO_FOLDER = 'cs3-videos';
const videoBoardId = (type, id) => `vb-${type}-${String(id).replace(/[^\w-]/g, '_')}`;
function ensureVideoBoard(type, id, meta) {
  const root = rootBoard(); if (!root) return null;
  if (!state.items.get(VIDEO_FOLDER)) add({ id: VIDEO_FOLDER, kind: 'board', name: 'Videos', parent: root.id, view: null, status: 'folder', isFolder: true });
  const bid = videoBoardId(type, id);
  let b = state.items.get(bid);
  if (!b) b = add({ id: bid, kind: 'board', name: meta.name || 'Untitled video', parent: VIDEO_FOLDER, view: null, status: meta.status || 'idea', due: meta.due || '', video: { type, id } });
  else {
    let changed = false;
    for (const k of ['name', 'status', 'due']) if (meta[k] && b[k] !== meta[k]) { b[k] = meta[k]; changed = true; }
    if (!b.video) { b.video = { type, id }; changed = true; }
    if (changed) save(b, true);
  }
  return bid;
}
function openFromHash() {
  /* the app puts what to open on the frame itself (works for the inline
     preview too, where there is no URL to carry a #) */
  let hash = location.hash;
  try { if (window.frameElement && window.frameElement.dataset.hash) hash = window.frameElement.dataset.hash; } catch (e) {}
  const q = new URLSearchParams(String(hash || '').replace(/^#/, ''));
  if (q.get('side') === '1') setSide(true);
  let target = q.get('board');
  const video = q.get('video');
  if (video && video.includes(':')) {
    const i = video.indexOf(':');
    target = ensureVideoBoard(video.slice(0, i), video.slice(i + 1),
      { name: q.get('name') || '', status: q.get('status') || '', due: q.get('due') || '' });
  }
  if (target && state.items.get(target)) { if (state.mode !== 'canvas') setMode('canvas'); openBoard(target); }
}
window.CS3Board = { openFromHash, videoBoardId, items: () => state.items, current: () => state.board,
  _: { mk, save, add, deleteCards, cardsOf } };   /* _ is for the browser tests */

(async function init() {
  await DB.open();
  let items = [];
  try { items = await DB.all(); } catch (e) { DB.mem = true; }
  items.forEach(i => { state.items.set(i.id, i); if (i.z > zTop) zTop = i.z; });
  let root = all().find(i => i.kind === 'board' && !i.parent);
  if (!root) root = seed();
  resetHistory();
  document.body.dataset.mode = 'canvas';
  openBoard(root.id);
  try { if (localStorage.getItem('storyboard-side') === '1' && !isNarrow()) setSide(true); } catch (e) {}
  openFromHash();
  window.addEventListener('hashchange', openFromHash);
  restoreReturnLink();
  if (DB.mem) toast('Saving is unavailable in this browser, so changes last only until you close the page.');
})();
})();
