<!-- Installed-web-app support. Deliberately not registered inside the Android
     APK or Electron: there the files come off disk already, a worker would add
     a second cache of them, and a stale one could override the real build. -->
<script>
(function(){
  var native = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform())
            || location.protocol === 'file:'
            || !!(window.process && window.process.versions && window.process.versions.electron);
  if(native || !('serviceWorker' in navigator)) return;
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(e){
      console.warn('[sw] not registered:', e && e.message);
    });
  });
  /* One reload when a new build takes over, so an update never needs the app
     to be force-quit. The guard stops the reload loop that otherwise happens
     when the worker claims a page that is already current. */
  var reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(reloaded) return; reloaded = true; location.reload();
  });
})();
</script>
